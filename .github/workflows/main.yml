name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project from zip
        run: |
          mkdir -p extracted
          unzip -q ./*.zip -d extracted
          SETTINGS=$(find extracted -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found inside zip"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project dir: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Apply my edited files
        run: |
          DICT_FILE=$(find extracted -name OfflineDictionary.kt -not -path "*/build/*" | head -n 1)
          VM_FILE=$(find extracted -name MainViewModel.kt -not -path "*/build/*" | head -n 1)
          MANIFEST=$(find extracted -name AndroidManifest.xml -path "*src/main*" | head -n 1)
          echo "Dictionary: $DICT_FILE"
          echo "ViewModel: $VM_FILE"
          echo "Manifest: $MANIFEST"
          cp OnlineDictionary.kt "$(dirname "$DICT_FILE")/OnlineDictionary.kt"
          cp MainViewModel.kt "$VM_FILE"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: List generated APKs
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-123-APK
          path: 'extracted/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
